# Ενημερώνει μία φορά τον μήνα μόνο τις εκδόσεις των GitHub Actions (checkout, setup-node κ.λπ.).
# Τα πακέτα npm ΔΕΝ τα πειράζει: το Expo θέλει συγκεκριμένες εκδόσεις (αναβάθμιση με npx expo install --fix).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "Actions" }
