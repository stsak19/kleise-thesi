name: Έλεγχος PR

# Τρέχει σε κάθε Pull Request προς το main: έλεγχος τύπων, tests (tests/*.test.ts) και build για web.
# Δεν ανεβάζει τίποτα· απλώς δείχνει πράσινο ή κόκκινο πριν το Merge.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Έλεγχος τύπων
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build για web
        run: npx expo export --platform web --output-dir web
      - name: Ενημερώθηκαν CHANGELOG και docs;
        # Μόνο προειδοποίηση (κίτρινο), δεν μπλοκάρει το Merge.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          changed=$(git diff --name-only FETCH_HEAD HEAD)
          if echo "$changed" | grep -qE '^(app|lib|supabase)/'; then
            echo "$changed" | grep -q '^CHANGELOG.md$' || echo "::warning::Άλλαξε κώδικας αλλά όχι το CHANGELOG.md (γράψε τι άλλαξε με [Στάθης]/[Λεωνίδας])."
            echo "$changed" | grep -qE '^(docs/|README.md)' || echo "::warning::Άλλαξε κώδικας αλλά κανένα αρχείο στο docs/ ή το README.md. Χρειάζεται ενημέρωση;"
          fi
