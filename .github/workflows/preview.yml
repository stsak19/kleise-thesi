name: Preview (προσωρινό)

on:
  push:
    branches: [ui-redesign]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir web
      - name: Build σε branch για προεπισκόπηση
        run: |
          cd web
          git init -q -b ui-preview-build
          git -c user.name=ci -c user.email=ci@local add -A
          git -c user.name=ci -c user.email=ci@local commit -qm preview
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-preview-build
