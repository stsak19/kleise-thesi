name: Web (GitHub Pages)

# Η κανονική σελίδα (https://stsak19.github.io/kleise-thesi/) από το main, στο branch gh-pages.
# Ο φάκελος pr-preview/ του gh-pages ανήκει στις προεπισκοπήσεις των PR (preview.yml) και δεν πειράζεται εδώ.
# Ρύθμιση στο GitHub: Settings → Pages → Source «Deploy from a branch» → gh-pages / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir web
      - run: cp .github/pages/404.html web/404.html && touch web/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
