name: Έλεγχος SQL

# Σε κάθε PR που αλλάζει κάτι στο supabase/: τρέχει schema.sql + όλα τα migrations (δύο φορές) σε άδεια βάση Postgres
# μέσα στο GitHub (scripts/elegxos-sql.sh). Δεν αγγίζει την πραγματική βάση Supabase.
on:
  pull_request:
    branches: [main]
    paths: ['supabase/**', 'scripts/elegxos-sql.sh', '.github/workflows/sql.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: schema.sql + migrations
        run: scripts/elegxos-sql.sh
